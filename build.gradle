plugins {
	id 'eclipse'
	id 'maven-publish'
	id 'net.minecraftforge.gradle' version '6.0.+'
}

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
	mappings channel: 'official', version: project.minecraft_version
	
	runs {
		client {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			mods {
				respound {
					source sourceSets.main
				}
			}
		}

		server {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'debug'
			mods {
				respound {
					source sourceSets.main
				}
			}
		}
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

// Сборка всех версий одной командой
task buildAllVersions(dependsOn: build) {
    description = "Builds the mod and creates copies for different Minecraft versions"
    group = "build"
    
    // Этот блок будет выполнен после завершения сборки
    doLast {
        // Путь к исходному JAR-файлу
        def sourceJar = file("build/libs/${archivesBaseName}-${project.mod_version}.jar")
        
        // Проверяем, что JAR существует
        if (!sourceJar.exists()) {
            throw new GradleException("JAR file not found at ${sourceJar}")
        }
        
        // Список версий для которых создаем копии
        def mcVersions = ['1.18.2', '1.19.4', '1.20.1']
        
        // Создаем копии для каждой версии
        mcVersions.each { mcVer ->
            def targetJar = file("build/libs/${archivesBaseName}-${project.mod_version}-mc${mcVer}.jar")
            
            // Копируем файл
            copy {
                from sourceJar
                into 'build/libs'
                rename { fileName -> fileName.replace('.jar', "-mc${mcVer}.jar") }
            }
            
            println "Created JAR for Minecraft ${mcVer}: ${targetJar.name}"
        }
        
        println "All versioned JARs created successfully!"
    }
}

jar {
	manifest {
		attributes([
			"Specification-Title": "respound",
			"Specification-Vendor": "respoundsareus",
			"Specification-Version": "1",
			"Implementation-Title": project.name,
			"Implementation-Version": "${project.mod_version}",
			"Implementation-Vendor" :"respoundsareus",
			"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
			"FMLModType": "MOD"
		])
	}
}

jar.finalizedBy('reobfJar')

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact jar
		}
	}
	repositories {
		maven {
			url "file://${project.projectDir}/mcmodsrepo"
		}
	}
}